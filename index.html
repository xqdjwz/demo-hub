<!-- index.html 前台首页 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演示站合集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
:root{--primary:#2563eb;--bg:#f4f6f8;--card:#fff;--text:#222;--muted:#666;--border:#e5e7eb}
body{background:var(--bg);color:var(--text);padding-top:64px}
/* 导航置顶栏 */
.header{position:fixed;top:0;left:0;right:0;height:64px;background:#fff;box-shadow:0 2px 8px #00000015;display:flex;align-items:center;padding:0 24px;gap:24px;z-index:99}
.logo{font-size:18px;font-weight:bold}
.nav-links{display:flex;gap:18px;align-items:center}
.nav-links a{text-decoration:none;color:#333}
.nav-links a:hover{color:var(--primary)}
.select-wrap{position:relative}
#catSelect{padding:6px 10px;border:1px solid var(--border);border-radius:6px}
.search-box{flex:1;max-width:320px;margin-left:auto}
#searchInput{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px}
.container{max-width:1400px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:0.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 6px 16px #00000012}
.card-img{height:140px;background:#eef2ff;display:flex;align-items:center;justify-content:center}
.card-img img{width:100%;height:100%;object-fit:contain}
.card-placeholder{font-size:42px;color:#2563eb}
.card-body{padding:12px}
.card-title{font-weight:600;margin-bottom:4px}
.card-status{display:inline-block;padding:2px 6px;border-radius:4px;font-size:12px;margin-bottom:6px}
.status-ok{background:#dcfce7;color:#166534}
.status-fail{background:#fee2e2;color:#991b1b}
.card-meta{font-size:12px;color:var(--muted)}
.pagination{margin-top:30px;display:flex;gap:10px;align-items:center;justify-content:center}
.pagination button{padding:6px 12px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer}
.pagination button:disabled{opacity:0.4;cursor:not-allowed}
.page-size{margin-left:12px}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:#00000060;display:none;align-items:center;justify-content:center;z-index:100}
.modal{width:min(600px,90vw);background:#fff;border-radius:12px;padding:20px;position:relative}
.modal-close{position:absolute;top:14px;right:16px;font-size:22px;cursor:pointer;color:#666}
.modal h3{margin-bottom:14px}
.modal-item{margin:8px 0}
.modal-label{font-weight:500;color:#444}
.modal a{color:var(--primary)}
/* 侧边上下按钮 */
.side-float{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:90}
.side-float button{width:40px;height:40px;border:none;border-radius:50%;background:#2563eb;color:#fff;cursor:pointer;font-size:18px}
footer{margin-top:40px;padding:24px;background:#fff;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:14px}
footer a{color:var(--primary);text-decoration:none;margin:0 8px}
.stats-bar{margin-bottom:20px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">演示站合集</div>
  <div class="nav-links">
    <a href="#all" data-cat="all">全部站点</a>
    <div id="articleNav"></div>
  </div>
  <div class="select-wrap">
    <select id="catSelect">
      <option value="all">全部分类</option>
    </select>
  </div>
  <div class="search-box">
    <input id="searchInput" placeholder="搜索站点名称">
  </div>
</div>
<div class="container">
  <div class="stats-bar">总浏览：<span id="totalView">0</span></div>
  <div class="grid" id="siteGrid"></div>
  <div class="pagination">
    <button id="prev">上一页</button>
    <span id="pageInfo"></span>
    <button id="next">下一页</button>
    <div class="page-size">每页：<select id="pageSel">
      <option value="12">12</option>
      <option value="24" selected>24</option>
      <option value="36">36</option>
      <option value="48">48</option>
    </select></div>
  </div>
</div>
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <span class="modal-close" id="modalClose">×</span>
    <div id="modalBody"></div>
  </div>
</div>
<div class="side-float">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <button onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">↓</button>
</div>
<footer>
  <div>©2026 演示站合集 | <a href="privacy.html">隐私政策</a> | <a href="disclaimer.html">免责声明</a> | <a href="sitemap.html">站点地图</a></div>
  <div style="margin-top:8px">本站所有演示站点仅用于技术演示，不承担任何使用分享相关责任</div>
</footer>
<script>
// 数据存储 key
const STORAGE_KEY = "demoHubData";
const VIEW_KEY = "demoHubViews";
let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {sites:[],articles:[],setting:{bg:""}};
let views = JSON.parse(localStorage.getItem(VIEW_KEY)) || {};
let currentCat = "all";
let searchKw = "";
let page = 1;
let pageSize = 24;
// 读取分类渲染导航
function renderCat(){
  const cats = [...new Set(data.sites.map(s=>s.category).filter(Boolean))];
  const sel = document.getElementById("catSelect");
  sel.innerHTML = `<option value="all">全部分类</option>`;
  cats.forEach(c=>sel.innerHTML += `<option value="${c}">${c}</option>`);
  // 文章导航
  const artNav = document.getElementById("articleNav");
  artNav.innerHTML = "";
  data.articles.forEach(a=>{
    artNav.innerHTML += `<a href="javascript:openArticle('${a.id}')">${a.title}</a>`
  })
}
// 过滤站点
function getFiltered(){
  return data.sites.filter(s=>{
    const matchCat = currentCat === "all" || s.category === currentCat;
    const matchKw = !searchKw || s.name.toLowerCase().includes(searchKw.toLowerCase());
    return matchCat && matchKw;
  })
}
// 渲染卡片
function renderGrid(){
  const list = getFiltered();
  const total = list.length;
  const start = (page-1)*pageSize;
  const pageData = list.slice(start,start+pageSize);
  const grid = document.getElementById("siteGrid");
  grid.innerHTML = "";
  pageData.forEach(site=>{
    // 浏览量统计
    if(!views[site.id]) views[site.id] = 0;
    const viewCnt = views[site.id];
    const statusText = site.status ? "正常" : "异常";
    const statusCls = site.status ? "status-ok" : "status-fail";
    let imgHtml = "";
    if(site.thumb){
      imgHtml = `<img src="${site.thumb}" alt="${site.name}">`
    }else{
      imgHtml = `<div class="card-placeholder">${site.name[0]||"-"}</div>`
    }
    grid.innerHTML += `
    <div class="card" onclick="openModal('${site.id}')">
      <div class="card-img">${imgHtml}</div>
      <div class="card-body">
        <div class="card-title">${site.name}</div>
        <span class="card-status ${statusCls}">${statusText}</span>
        <div class="card-meta">浏览：${viewCnt}</div>
      </div>
    </div>`
  })
  document.getElementById("pageInfo").innerText = `${page} / ${Math.ceil(total/pageSize)||1}`;
  document.getElementById("prev").disabled = page <= 1;
  document.getElementById("next").disabled = start + pageSize >= total;
  // 总浏览
  const totalView = Object.values(views).reduce((a,b)=>a+b,0);
  document.getElementById("totalView").innerText = totalView;
}
// 打开弹窗
function openModal(id){
  const site = data.sites.find(s=>s.id===id);
  if(!site) return;
  // 浏览量+1
  views[id] = (views[id] || 0)+1;
  localStorage.setItem(VIEW_KEY,JSON.stringify(views));
  renderGrid();
  const mask = document.getElementById("modalMask");
  const body = document.getElementById("modalBody");
  const statusText = site.status ? "正常" : "异常";
  body.innerHTML = `
    <h3>${site.name}</h3>
    <div class="modal-item"><span class="modal-label">状态：</span><span class="${site.status?'status-ok':'status-fail'}">${statusText}</span></div>
    <div class="modal-item"><span class="modal-label">简介：</span>${site.desc||"-"}</div>
    <div class="modal-item"><span class="modal-label">功能：</span>${site.features||"-"}</div>
    <div class="modal-item"><span class="modal-label">演示账号：</span>${site.account||"-"}</div>
    <div class="modal-item"><span class="modal-label">演示密码：</span>${site.pwd||"-"}</div>
    <div class="modal-item"><span class="modal-label">最近检测：</span>${site.checkTime||"-"}</div>
    <div class="modal-item"><a href="${site.demoUrl}" target="_blank">打开演示站</a></div>
    <div class="modal-item"><a href="${site.sourceUrl}" target="_blank">源码地址</a></div>
  `
  mask.style.display="flex";
}
function closeModal(){document.getElementById("modalMask").style.display="none"}
document.getElementById("modalClose").onclick = closeModal;
document.getElementById("modalMask").onclick = e=>{if(e.target.id==="modalMask") closeModal()}
// 文章弹窗
function openArticle(id){
  const art = data.articles.find(a=>a.id===id);
  if(!art) return;
  const mask = document.getElementById("modalMask");
  const body = document.getElementById("modalBody");
  body.innerHTML = `<h3>${art.title}</h3><div style="margin-top:12px;white-space:pre-line">${art.content}</div>`;
  mask.style.display="flex";
}
// 事件监听
document.getElementById("catSelect").onchange = e=>{
  currentCat = e.target.value;
  page=1;renderGrid();
}
document.getElementById("searchInput").oninput = e=>{
  searchKw = e.target.value.trim();
  page=1;renderGrid();
}
document.getElementById("prev").onclick = ()=>{page--;renderGrid()}
document.getElementById("next").onclick = ()=>{page++;renderGrid()}
document.getElementById("pageSel").onchange = e=>{
  pageSize = Number(e.target.value);
  page=1;renderGrid();
}
// 全部站点点击
document.querySelector('[data-cat="all"]').onclick = ()=>{
  currentCat="all";page=1;document.getElementById("catSelect").value="all";renderGrid();
}
// 监听本地存储更新（后台保存后前台自动刷新）
window.addEventListener("storage",e=>{
  if(e.key===STORAGE_KEY){
    data = JSON.parse(e.newValue);
    renderCat();renderGrid();
  }
  if(e.key===VIEW_KEY){
    views = JSON.parse(e.newValue);renderGrid();
  }
})
// 初始化
renderCat();renderGrid();
</script>
</body>
</html>
