<!-- admin.html 后台管理页 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演示站合集 · 后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{padding:20px;background:#f4f6f8}
.tab{display:flex;gap:6px;margin-bottom:16px}
.tab button{padding:8px 14px;border:none;background:#e5e7eb;border-radius:6px;cursor:pointer}
.tab button.active{background:#2563eb;color:#fff}
.panel{display:none;background:#fff;padding:18px;border-radius:10px;margin-bottom:16px}
.panel.active{display:block}
.form-item{margin:10px 0}
label{display:block;margin-bottom:4px;font-weight:500}
input,textarea,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px}
textarea{min-height:90px}
.btn{padding:8px 14px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;margin:4px}
.btn-danger{background:#dc2626}
table{width:100%;border-collapse:collapse;margin:12px 0}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
</style>
</head>
<body>
<div class="tab">
  <button data-tab="site" class="active">站点管理</button>
  <button data-tab="article">文章管理</button>
  <button data-tab="setting">站点设置</button>
  <button data-tab="data">数据管理</button>
</div>
<!-- 站点管理 -->
<div class="panel active" id="p-site">
  <h3>添加/编辑站点</h3>
  <div class="form-item"><label>名称</label><input id="s-name"></div>
  <div class="form-item"><label>分类</label><input id="s-cat"></div>
  <div class="form-item"><label>缩略图地址</label><input id="s-thumb"></div>
  <div class="form-item"><label>是否正常</label><select id="s-status"><option value="1">正常</option><option value="0">异常</option></select></div>
  <div class="form-item"><label>简介</label><textarea id="s-desc"></textarea></div>
  <div class="form-item"><label>功能</label><textarea id="s-feat"></textarea></div>
  <div class="form-item"><label>演示账号</label><input id="s-acc"></div>
  <div class="form-item"><label>演示密码</label><input id="s-pwd"></div>
  <div class="form-item"><label>演示站地址</label><input id="s-demo"></div>
  <div class="form-item"><label>源码地址</label><input id="s-source"></div>
  <input type="hidden" id="s-id">
  <button class="btn" onclick="saveSite()">保存站点</button>
  <h4 style="margin-top:20px">站点列表</h4>
  <div id="siteList"></div>
</div>
<!-- 文章管理 -->
<div class="panel" id="p-article">
  <h3>添加文章（标题展示在置顶导航）</h3>
  <div class="form-item"><label>标题</label><input id="a-title"></div>
  <div class="form-item"><label>内容</label><textarea id="a-content"></textarea></div>
  <input type="hidden" id="a-id">
  <button class="btn" onclick="saveArticle()">保存文章</button>
  <div id="artList"></div>
</div>
<!-- 设置 -->
<div class="panel" id="p-setting">
  <div class="form-item"><label>背景图URL</label><input id="bg-input"></div>
  <button class="btn" onclick="saveSetting()">保存设置</button>
</div>
<!-- 数据导入导出 -->
<div class="panel" id="p-data">
  <button class="btn" onclick="exportJson()">导出JSON</button>
  <button class="btn" onclick="document.getElementById('importFile').click()">导入JSON</button>
  <input type="file" id="importFile" accept=".json" hidden onchange="importJson(event)">
  <div style="margin-top:12px">说明：导出的json上传到仓库data/sites.json，触发pages部署更新</div>
</div>
<script>
const STORAGE_KEY = "demoHubData";
let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {sites:[],articles:[],setting:{bg:""}};
// 切换标签
document.querySelectorAll(".tab button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById("p-"+b.dataset.tab).classList.add("active");
})
function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  // 触发前台storage事件，前台立刻刷新
  window.dispatchEvent(new StorageEvent("storage",{key:STORAGE_KEY,newValue:JSON.stringify(data)}));
  alert("保存成功！前台即时生效");
  renderSiteList();renderArtList();
}
// 站点
function saveSite(){
  const id = document.getElementById("s-id").value || Date.now().toString();
  const site = {
    id,
    name:document.getElementById("s-name").value.trim(),
    category:document.getElementById("s-cat").value.trim(),
    thumb:document.getElementById("s-thumb").value.trim(),
    status:Number(document.getElementById("s-status").value),
    desc:document.getElementById("s-desc").value.trim(),
    features:document.getElementById("s-feat").value.trim(),
    account:document.getElementById("s-acc").value.trim(),
    pwd:document.getElementById("s-pwd").value.trim(),
    demoUrl:document.getElementById("s-demo").value.trim(),
    sourceUrl:document.getElementById("s-source").value.trim(),
    checkTime:new Date().toLocaleString()
  }
  if(!site.name) return alert("站点名称不能为空");
  const idx = data.sites.findIndex(x=>x.id===id);
  if(idx>-1) data.sites[idx]=site;
  else data.sites.push(site);
  saveData();
  clearSiteForm();
}
function clearSiteForm(){
  document.getElementById("s-id").value="";
  document.getElementById("s-name").value="";
  document.getElementById("s-cat").value="";
  document.getElementById("s-thumb").value="";
  document.getElementById("s-status").value="1";
  document.getElementById("s-desc").value="";
  document.getElementById("s-feat").value="";
  document.getElementById("s-acc").value="";
  document.getElementById("s-pwd").value="";
  document.getElementById("s-demo").value="";
  document.getElementById("s-source").value="";
}
function renderSiteList(){
  const wrap = document.getElementById("siteList");
  wrap.innerHTML = `<table><tr><th>名称</th><th>分类</th><th>状态</th><th>操作</th></tr>`
  data.sites.forEach(s=>{
    wrap.innerHTML += `<tr>
      <td>${s.name}</td>
      <td>${s.category}</td>
      <td>${s.status?"正常":"异常"}</td>
      <td>
        <button class="btn" onclick="editSite('${s.id}')">编辑</button>
        <button class="btn btn-danger" onclick="delSite('${s.id}')">删除</button>
      </td>
    </tr>`
  })
  wrap.innerHTML += "</table>"
}
function editSite(id){
  const s = data.sites.find(x=>x.id===id);
  if(!s) return;
  document.getElementById("s-id").value = s.id;
  document.getElementById("s-name").value = s.name;
  document.getElementById("s-cat").value = s.category;
  document.getElementById("s-thumb").value = s.thumb;
  document.getElementById("s-status").value = s.status;
  document.getElementById("s-desc").value = s.desc;
  document.getElementById("s-feat").value = s.features;
  document.getElementById("s-acc").value = s.account;
  document.getElementById("s-pwd").value = s.pwd;
  document.getElementById("s-demo").value = s.demoUrl;
  document.getElementById("s-source").value = s.sourceUrl;
}
function delSite(id){
  if(!confirm("确认删除？")) return;
  data.sites = data.sites.filter(x=>x.id!==id);
  saveData();
}
// 文章
function saveArticle(){
  const id = document.getElementById("a-id").value || Date.now().toString();
  const art = {id,title:document.getElementById("a-title").value.trim(),content:document.getElementById("a-content").value.trim()};
  if(!art.title) return alert("标题不能为空");
  const idx = data.articles.findIndex(x=>x.id===id);
  if(idx>-1) data.articles[idx]=art;
  else data.articles.push(art);
  saveData();
  clearArtForm();
}
function clearArtForm(){
  document.getElementById("a-id").value="";
  document.getElementById("a-title").value="";
  document.getElementById("a-content").value="";
}
function renderArtList(){
  const wrap = document.getElementById("artList");
  wrap.innerHTML = `<table><tr><th>标题</th><th>操作</th></tr>`
  data.articles.forEach(a=>{
    wrap.innerHTML += `<tr><td>${a.title}</td><td>
      <button class="btn" onclick="editArt('${a.id}')">编辑</button>
      <button class="btn btn-danger" onclick="delArt('${a.id}')">删除</button>
    </td></tr>`
  })
  wrap.innerHTML += "</table>"
}
function editArt(id){
  const a = data.articles.find(x=>x.id===id);
  if(!a) return;
  document.getElementById("a-id").value=a.id;
  document.getElementById("a-title").value=a.title;
  document.getElementById("a-content").value=a.content;
}
function delArt(id){
  if(!confirm("确认删除？")) return;
  data.articles = data.articles.filter(x=>x.id!==id);
  saveData();
}
// 设置
function saveSetting(){
  data.setting.bg = document.getElementById("bg-input").value.trim();
  saveData();
}
// 导入导出
function exportJson(){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="sites.json";
  a.click();
}
function importJson(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    try{
      data = JSON.parse(ev.target.result);
      saveData();
      alert("导入成功");
    }catch(err){alert("JSON格式错误")}
  }
  r.readAsText(f);
}
// 初始化
renderSiteList();renderArtList();
document.getElementById("bg-input").value = data.setting.bg||"";
</script>
</body>
</html>
